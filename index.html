<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>My Portfolio</h1>

        <!-- NAVBAR -->
        <nav>
            <a href="#home">Home</a> |
            <a href="#about">About</a> |
            <a href="#work">Work</a> |
            <a href="#resume">Resume</a> |
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>

        <!-- HOME -->
        <section id="home">
            <h2>Home</h2>
            <p>Welcome to my portfolio website.</p>
        </section>

        <!-- ABOUT -->
        <section id="about">
            <h2>About Me</h2>
            <p>I am learning web development and creating websites using HTML.</p>

            <!-- ONE LIST -->
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>
        </section>

        <!-- WORK -->
        <section id="work">
            <h2>My Work</h2>

            <!-- ONE VIDEO -->
            <video width="400" controls>
                <source src="video.mp4" type="video/mp4">
            </video>
        </section>

        <!-- RESUME -->
        <section id="resume">
            <h2>Resume</h2>
            <p>Student learning web development.</p>
        </section>

        <!-- CONTACT -->
        <section id="contact">
            <h2>Contact Me</h2>

            <!-- ONE FORM -->
            <form>
                <label>Name:</label><br>
                <input type="text"><br><br>

                <label>Email:</label><br>
                <input type="email"><br><br>

                <input type="submit" value="Send">
            </form>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 My Portfolio</p>
    </footer>

</body>
</html>
